<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Pragyan Singh Portfolio</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ============ Design tokens (shared palette with the main site) ============ */
        :root,
        [data-theme="dark"] {
            --bg: #0d1321;
            --bg-grid: #111a2c;
            --surface: #131b2e;
            --surface-2: #1b2540;
            --border: #253052;
            --text: #e7ecf5;
            --text-muted: #93a0bd;
            --accent: #e8a33d;
            --accent-soft: rgba(232, 163, 61, 0.14);
            --accent-2: #3aafa9;
            --danger: #e5686d;
            --danger-soft: rgba(229, 104, 109, 0.12);
            --success: #59c896;
            --success-soft: rgba(89, 200, 150, 0.12);
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        [data-theme="light"] {
            --bg: #eef1f6;
            --bg-grid: #e6eaf2;
            --surface: #ffffff;
            --surface-2: #f6f8fc;
            --border: #d8deea;
            --text: #10151f;
            --text-muted: #51597a;
            --accent: #c97f1e;
            --accent-soft: rgba(201, 127, 30, 0.12);
            --accent-2: #1e8c86;
            --danger: #c9333a;
            --danger-soft: rgba(201, 51, 58, 0.08);
            --success: #1f8f5f;
            --success-soft: rgba(31, 143, 95, 0.1);
            --shadow: 0 12px 28px rgba(20, 30, 60, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans', Arial, sans-serif;
            background:
                linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 100% 42px,
                var(--bg);
            color: var(--text);
            transition: background-color .35s ease, color .35s ease;
            line-height: 1.5;
            min-height: 100vh;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
        }

        h1, h2 {
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: -0.01em;
        }

        a { color: inherit; }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .is-hidden { display: none !important; }

        /* ============ Header ============ */
        .site-header {
            padding: 24px 0;
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
        }

        .brand .lock {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        .back-link {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
        }

        .back-link:hover { color: var(--accent); }

        #toggle-theme {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: border-color .2s ease, transform .2s ease;
        }

        #toggle-theme:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        #toggle-theme svg { width: 14px; height: 14px; }

        /* ============ Main ============ */
        main { padding: 48px 0; }

        .eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px;
            box-shadow: var(--shadow);
        }

        #login-panel .panel { max-width: 380px; margin: 0 auto; }

        form .field { margin-bottom: 16px; }

        label {
            display: block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 8px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 14px;
            transition: border-color .2s ease;
        }

        input:focus { border-color: var(--accent); }

        button {
            appearance: none;
            border: none;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: filter .2s ease, transform .2s ease;
        }

        button[type="submit"] {
            background: var(--accent);
            color: var(--bg);
        }

        button[type="submit"]:hover,
        .btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .btn.secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .form-status {
            margin-top: 14px;
            font-size: 13px;
            padding: 10px 12px;
            border-radius: 8px;
            display: none;
        }

        .form-status.show { display: block; }
        .form-status.ok { background: var(--success-soft); color: var(--success); }
        .form-status.err { background: var(--danger-soft); color: var(--danger); }

        /* ============ Dashboard ============ */
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .messages-list { display: grid; gap: 12px; }

        .message-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 18px;
        }

        .message-card .meta {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .message-card .meta .who { color: var(--text); font-weight: 500; }
        .message-card p { font-size: 14px; }

        .empty-state {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--text-muted);
            padding: 24px;
            text-align: center;
            border: 1px dashed var(--border);
            border-radius: 10px;
        }

        .scan-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg, transparent, var(--accent-soft) 45%, transparent);
            transform: translateY(-100%);
            opacity: 0;
            z-index: 999;
        }

        .scan-overlay.run { animation: scan .5s ease-out; }

        @keyframes scan {
            0% { transform: translateY(-100%); opacity: .9; }
            100% { transform: translateY(100%); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .scan-overlay.run { animation: none !important; }
        }

        @media (max-width: 560px) {
            .header-inner { flex-wrap: wrap; }
        }
    </style>
</head>

<body>
    <div class="scan-overlay" id="scan-overlay" aria-hidden="true"></div>

    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <span class="lock" aria-hidden="true"></span>
                <span>// admin_panel</span>
            </div>
            <div style="display:flex;align-items:center;gap:16px;">
                <a class="back-link" href="index.html">← back to portfolio</a>
                <button id="toggle-theme" type="button" aria-label="Toggle color theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <span id="theme-label">Dark</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <section id="login-panel">
                <p class="eyebrow">// admin_login</p>
                <div class="panel">
                    <h1 style="font-size:20px;margin-bottom:20px;">Admin Login</h1>
                    <form id="admin-form" novalidate>
                        <div class="field">
                            <label for="admin-email">Email</label>
                            <input type="email" id="admin-email" name="email" required>
                        </div>
                        <div class="field">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <button type="submit">Log in</button>
                        <p class="form-status" id="admin-status" role="status"></p>
                    </form>
                </div>
            </section>

            <section id="dashboard-panel" class="is-hidden">
                <p class="eyebrow">// user_messages</p>
                <div class="panel">
                    <div class="panel-head">
                        <h1 style="font-size:20px;">User Messages</h1>
                        <div style="display:flex;gap:8px;">
                            <button class="btn secondary" id="refresh-messages" type="button">Refresh</button>
                            <button class="btn secondary" id="logout-admin" type="button">Log out</button>
                        </div>
                    </div>
                    <div class="messages-list" id="messages-list"></div>
                </div>
            </section>
        </div>
    </main>

    <script src="Shared.js"></script>
    <script>
        initThemeToggle();

        const loginPanel = document.getElementById("login-panel");
        const dashboardPanel = document.getElementById("dashboard-panel");
        const adminForm = document.getElementById("admin-form");
        const adminStatus = document.getElementById("admin-status");
        const messagesList = document.getElementById("messages-list");
        const logoutBtn = document.getElementById("logout-admin");
        const refreshBtn = document.getElementById("refresh-messages");

        function showStatus(el, message, ok) {
            el.textContent = message;
            el.classList.remove("ok", "err");
            el.classList.add("show", ok ? "ok" : "err");
        }

        function showDashboard() {
            loginPanel.classList.add("is-hidden");
            dashboardPanel.classList.remove("is-hidden");
            renderMessages();
        }

        function showLogin() {
            dashboardPanel.classList.add("is-hidden");
            loginPanel.classList.remove("is-hidden");
        }

        async function renderMessages() {
            messagesList.innerHTML = `<p class="empty-state">Loading messages…</p>`;
            let messages = [];
            try {
                messages = await DB.list();
            } catch (err) {
                messagesList.innerHTML = `<p class="empty-state">Could not load messages. Please try refresh.</p>`;
                return;
            }
            messages.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            if (!messages.length) {
                messagesList.innerHTML = `<p class="empty-state">No messages yet — messages sent from the portfolio's Contact Me form will show up here.</p>`;
                return;
            }
            messagesList.innerHTML = messages.map(m => `
                <div class="message-card">
                    <div class="meta">
                        <span class="who">${escapeHtml(m.name || "Anonymous")} · ${escapeHtml(m.email || "")}</span>
                        <span>${escapeHtml(formatTimestamp(m.timestamp))}</span>
                    </div>
                    <p>${escapeHtml(m.message || "")}</p>
                </div>
            `).join("");
        }

        adminForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const password = document.getElementById("password").value;
            try {
                const ok = await DB.login(password);
                if (ok) {
                    sessionStorage.setItem(ADMIN_SESSION_KEY, "1");
                    adminForm.reset();
                    showDashboard();
                } else {
                    showStatus(adminStatus, "Incorrect credentials.", false);
                }
            } catch (err) {
                showStatus(adminStatus, "Login failed — check your connection and try again.", false);
            }
        });

        logoutBtn.addEventListener("click", () => {
            sessionStorage.removeItem(ADMIN_SESSION_KEY);
            showLogin();
        });

        refreshBtn.addEventListener("click", renderMessages);

        // Stay logged in across a reload of this tab, but not across new tabs.
        if (sessionStorage.getItem(ADMIN_SESSION_KEY) === "1") {
            showDashboard();
        }
    </script>
</body>

</html>
